services:
  homehq:
    build: ./backend
    image: homehq-backend:latest
    container_name: homehq
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOMEHQ_DATA_DIR: /data
    ports:
      - "${HOMEHQ_PORT:-8787}:8787"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
